name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ main, completion/gamerz-social-features, free-tier/firestore-client-backend ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Show debug signing fingerprint
        run: gradle :app:signingReport

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-build-${GITHUB_RUN_NUMBER}" \
            app/build/outputs/apk/debug/app-debug.apk#Gamerz-debug.apk \
            --title "Gamerz test build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug test build only. Not for Google Play distribution." \
            --latest

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Gamerz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
